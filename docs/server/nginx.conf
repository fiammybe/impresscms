# ImpressCMS on nginx with PHP-FPM (docs/symfony-host.md).
#
# Adjust server_name, root (the web root: the contents of htdocs/) and the
# PHP-FPM address. ImpressCMS needs every PHP request to reach index.php and so
# the host (routing level 3): legacy scripts that PHP-FPM runs directly answer
# with a "configure your web server" page once the host is installed.
#
# nginx ignores .htaccess files: the "never served" locations replace them.

upstream impresscms_php {
    server unix:/run/php/php-fpm.sock;
}

server {
    listen 80;
    server_name example.test;
    root /var/www/impresscms;
    index index.php index.html;

    # Never served: the host's staging directory, compiled templates, caches,
    # tests, PHP files in uploads/, hidden files and folders, and directories
    # that ImpressCMS protects with their own .htaccess.
    location ~ ^/(trust_dist|templates_c|cache|tests|plugins/waiting|libraries/tcpdf/tools|install/modules/protector/trust_path)(/|$) {
        return 404;
    }
    location ~ ^/uploads/.*\.php$ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    # Unknown paths go to index.php: the host serves its routes there.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Every PHP script runs through index.php; REQUEST_URI keeps the original
    # path, which the host dispatches to the new application or the legacy script.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass impresscms_php;
    }
}
