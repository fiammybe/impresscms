parameters:
    app.legacy_root: '%kernel.project_dir%/../htdocs'
    app.legacy_front_controller: '%app.legacy_root%/legacy_index.php'
    app.symfony_prefixes:
        - '/__symfony'
        - '/__migration'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Bridge\RequestOwnershipDecider:
        public: true
        arguments:
            $symfonyPrefixes: '%app.symfony_prefixes%'

    App\Bridge\LegacyScriptResolver:
        arguments:
            $legacyRoot: '%app.legacy_root%'
            $legacyFrontController: '%app.legacy_front_controller%'

    App\Bridge\LegacyBridge:
        public: true
        arguments:
            $legacyRoot: '%app.legacy_root%'

    App\Controller\MigrationStatusController:
        public: true
        tags: ['controller.service_arguments']
        arguments:
            $legacyRoot: '%app.legacy_root%'
