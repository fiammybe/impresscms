# The security token is the identity of the whole site (OpenSpec change
# symfony-owns-the-session): legacy pages take icms::$user from it through
# App\Session\Host. The firewall is lazy, so requests that never ask for the
# user do not touch the session; a login form post runs its authenticator.
security:
    # Argon2id (bcrypt without Argon2): Icms\Core\Password::hasher(), shared with
    # legacy code; legacy formats verify through icms_legacy and are replaced
    # after the login (OpenSpec change symfony-password-login)
    password_hashers:
        icms_legacy:
            id: App\Security\Password\Hasher\Legacy
        App\Security\User\Entity:
            id: App\Security\Password\Hasher\Modern
            migrate_from: [icms_legacy]

    providers:
        icms:
            id: App\Security\User\Provider

    firewalls:
        main:
            lazy: true
            provider: icms
            user_checker: App\Security\User\Checker
            # Password: the legacy login forms. Legacy: programmatic logins by
            # legacy code (App\Session\Host), and the entry point (the login page)
            custom_authenticators:
                - App\Security\Authenticator\Password
                - App\Security\Authenticator\Legacy
            entry_point: App\Security\Authenticator\Legacy
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            # remember-me-and-email-links: persistent, rotating tokens in
            # <prefix>_rememberme_token, offered by the login form's "rememberme"
            # when the preference allows it (App\Security\Authenticator\Password)
            remember_me:
                secret: '%kernel.secret%'
                name: ICMSREMEMBERME
                lifetime: 604800
                remember_me_parameter: rememberme
                token_provider:
                    service: App\Security\RememberMe\TokenProvider
            # login and reset links by e-mail (App\Controller\Auth\Mail): only a
            # POST to the link logs in, once, within 15 minutes, while the
            # password is unchanged
            login_link:
                check_route: icms_auth_link_check
                check_post_only: true
                signature_properties: [id, loginName, password]
                lifetime: 900
                max_uses: 1
                success_handler: App\Security\Login\Responder
                failure_handler: App\Security\Login\Responder

    # Restrict Symfony routes with #[IsGranted('ROLE_USER')], 'ROLE_WEBMASTER',
    # 'ROLE_GROUP_<id>' or 'icms_perm:<permission>' (App\Security\ModulePermissionVoter).
    access_control: []
