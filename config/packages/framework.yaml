framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    # The host owns the session (OpenSpec change symfony-owns-the-session): native
    # PHP sessions in the ImpressCMS `session` table, named and timed by the
    # ImpressCMS preferences (App\Session\Storage\Factory); legacy code
    # uses it through App\Session\Host
    session:
        storage_factory_id: App\Session\Storage\Factory
        handler_id: ~
    csrf_protection: true
    # mail through the ImpressCMS mail preferences (App\Mail\Transport\Factory)
    mailer:
        dsn: 'icms://default'
    rate_limiter:
        # login and reset links per address and IP (App\Controller\Auth\Mail)
        icms_mail_link:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
    php_errors:
        log: true
    # the Symfony 8 default, set explicitly (deprecated to leave unset since 7.3)
    property_info:
        with_constructor_extractor: true

when@test:
    framework:
        test: true
        # mails as .eml files, read by the Http tests
        mailer:
            dsn: 'icms+dir://default?path=%kernel.project_dir%/var/test/mail'
