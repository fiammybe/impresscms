name: Hardcoded HTML guard

on:
  pull_request:
    paths:
      - 'htdocs/libraries/icms/**'
      - 'bin/find-hardcoded-html.php'
      - 'bin/hardcoded-html-baseline.txt'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Check for new hardcoded HTML in htdocs/libraries/icms
        run: php bin/find-hardcoded-html.php --check=bin/hardcoded-html-baseline.txt
